name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC), see docs.npmjs.com/trusted-publishers

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No registry-url: it writes an _authToken line to .npmrc that trusted publishing
      # doesn't use. Trusted publishing needs npm 11.5.1+, bundled from Node 24.5.0 on.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
