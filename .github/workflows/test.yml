name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (Node ${{ matrix.node }})
    # A fixed project name, so the log step below finds the containers the test run started.
    env:
      COMPOSE_PROJECT_NAME: tenora-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:docker sets a URL for every database, so one that is down fails the run instead
      # of being skipped. The grep keeps that true if a database is added to the suite later.
      # An explicit bash shell is what enables pipefail, without it tee hides a test failure.
      - name: Run tests against every database
        shell: bash
        run: |
          npm run test:docker 2>&1 | tee test.log
          if grep -q SKIPPED test.log; then
            echo "::error::A database was skipped"
            exit 1
          fi

      # Only has output if a server failed to start: the test run removes its containers.
      - name: Show database logs
        if: failure()
        run: docker compose -f tests/docker-compose.yml logs --no-color --tail=200
