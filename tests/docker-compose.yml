# Newest server versions for `npm run test:docker`. Ports are deliberately non-default
# so these can never be confused with a database already running on the machine.
name: tenora-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: Tenora_test_pw1
    ports:
      - "127.0.0.1:56432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Lets the non-SUPER tenant user create triggers while binary logging is on, as in production.
  mysql:
    image: mysql:9
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: Tenora_test_pw1
    ports:
      - "127.0.0.1:56306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pTenora_test_pw1 --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  mariadb:
    image: mariadb:12
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MARIADB_ROOT_PASSWORD: Tenora_test_pw1
    ports:
      - "127.0.0.1:56307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 60

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Tenora_test_pw1
    ports:
      - "127.0.0.1:56433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Tenora_test_pw1 -Q "select 1"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
